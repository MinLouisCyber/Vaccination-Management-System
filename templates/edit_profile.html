{% extends "base.html" %}

{% block title %}Chỉnh sửa hồ sơ - Vinavacci{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
            <h2 class="text-lg font-medium text-gray-900">Chỉnh sửa hồ sơ</h2>
        </div>
        <form method="POST" action="{{ url_for('main.edit_profile', profile_id=profile.profile_id) }}" class="p-6 space-y-4">
            <div>
                <label for="fname" class="block text-sm font-medium text-gray-700">Tên</label>
                <input type="text" name="fname" id="fname" value="{{ profile.fname }}" required
                    class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="mname" class="block text-sm font-medium text-gray-700">Tên đệm (Tùy chọn)</label>
                <input type="text" name="mname" id="mname" value="{{ profile.mname }}"
                    class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="lname" class="block text-sm font-medium text-gray-700">Họ</label>
                <input type="text" name="lname" id="lname" value="{{ profile.lname }}" required
                    class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="age" class="block text-sm font-medium text-gray-700">Tuổi</label>
                <input type="number" name="age" id="age" value="{{ profile.age }}" required
                    class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="gender" class="block text-sm font-medium text-gray-700">Giới tính</label>
                <select name="gender" id="gender" required
                    class="mt-1 p-2 w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="Nam" {% if profile.gender=='Nam' %}selected{% endif %}>Nam</option>
                    <option value="Nữ" {% if profile.gender=='Nữ' %}selected{% endif %}>Nữ</option>
                    <option value="Khác" {% if profile.gender=='Khác' %}selected{% endif %}>Khác</option>
                </select>
            </div>
            <div class="flex justify-end space-x-4">
                <a href="{{ url_for('main.dashboard') }}"
                    class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50">Hủy</a>
                <button type="submit"
                    class="px-4 py-2 border border-transparent text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Lưu thay đổi
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
